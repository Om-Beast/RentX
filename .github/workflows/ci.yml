name: RentX CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — Test & Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend tests
        working-directory: backend
        env:
          NODE_ENV: test
          PORT: 5001
          # MONGO_URI is overridden by tests/setup.js (MongoMemoryReplSet)
          # Setting a placeholder to satisfy any env checks before override
          MONGO_URI: mongodb://localhost:27017/rentx_test_placeholder
          JWT_SECRET: test_secret_key_for_ci_only_not_real_minimum_64_chars_rentx_portfolio_2025
          RAZORPAY_KEY_ID: rzp_test_dummy
          RAZORPAY_KEY_SECRET: dummy_razorpay_secret_32chars_ok_
          RAZORPAY_WEBHOOK_SECRET: dummy_webhook_secret_32chars_ok__
          GEMINI_API_KEY: dummy_gemini_key
          FRONTEND_URL: http://localhost:5173
        run: npm test

      - name: Security audit
        working-directory: backend
        run: npm audit --audit-level=high

  frontend:
    name: Frontend — Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: https://rentx-1-ltjq.onrender.com
          VITE_RAZORPAY_KEY_ID: rzp_test_dummy
        run: npm run build
